[project]
name = "maimai-score-check"
version = "0.1.0"
description = "基于水鱼(diving-fish) API 的 maimai 成绩合法性校验器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
